# Thresholds for check.sh. Override with HEALTH_CONF=/path/to/file or check.sh -c FILE.

DISK_WARN_PCT=80
DISK_FAIL_PCT=90

# Load compared to CPU count: warn if load1 >= nproc * LOAD_WARN_MULT
LOAD_WARN_MULT=1
LOAD_FAIL_MULT=2

MEM_WARN_PCT=85
MEM_FAIL_PCT=95

# Approximate failed SSH/auth events in the last AUTH_WINDOW_MIN minutes
AUTH_FAIL_WARN=10
AUTH_WINDOW_MIN=60

CHECK_UNITS=1
CHECK_LISTENERS=1
CHECK_AUTH=1
